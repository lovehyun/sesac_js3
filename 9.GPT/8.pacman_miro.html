<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neon Pacman + Maze (Readable)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06060c; overflow: hidden; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; top: 10px;
      color: #e8e8ff; font: 14px/1.2 ui-monospace, Menlo, Consolas, monospace;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div id="hud">Score: <b id="score">0</b> · WASD/Arrow</div>
  <canvas id="canvas"></canvas>

  <script>
    /**********************
     * 0) Canvas / Utils
     **********************/
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    const DPR = Math.max(1, window.devicePixelRatio || 1);

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function rand(min, max) { return min + Math.random() * (max - min); }

    function resizeCanvas() {
      canvas.width = window.innerWidth * DPR;
      canvas.height = window.innerHeight * DPR;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    /**********************
     * 1) Input
     **********************/
    const pressedKeys = new Set();
    window.addEventListener("keydown", (e) => pressedKeys.add(e.key));
    window.addEventListener("keyup", (e) => pressedKeys.delete(e.key));

    function getMoveVector() {
      let dx = 0, dy = 0;
      if (pressedKeys.has("ArrowLeft") || pressedKeys.has("a") || pressedKeys.has("A")) dx -= 1;
      if (pressedKeys.has("ArrowRight") || pressedKeys.has("d") || pressedKeys.has("D")) dx += 1;
      if (pressedKeys.has("ArrowUp") || pressedKeys.has("w") || pressedKeys.has("W")) dy -= 1;
      if (pressedKeys.has("ArrowDown") || pressedKeys.has("s") || pressedKeys.has("S")) dy += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
      }
      return { dx, dy };
    }

    /**********************
     * 2) Maze (Tile Map)
     **********************/
    const TILE = 32; // 타일 크기(픽셀)

    // 1=벽, 0=길
    // 가독성 위해 문자열로 작성 후 파싱
    const MAP_STR = [
      "11111111111111111111",
      "10000000001100000001",
      "10111111101101111101",
      "10100000100001000001",
      "10101110111101110101",
      "10101000100001000101",
      "10101011101111011101",
      "10001000001000010001",
      "11101111101011101111",
      "10000000000000000001",
      "10111101111111011101",
      "10000101000001010001",
      "11110101111101011111",
      "10000100000000010001",
      "10111111101111111101",
      "10000000001000000001",
      "10111111111011111101",
      "10000000000000000001",
      "11111111111111111111",
    ].map(row => row.split("").map(ch => ch === "1" ? 1 : 0));

    const maze = {
      map: MAP_STR,
      rows: MAP_STR.length,
      cols: MAP_STR[0].length,
      offsetX: 0,
      offsetY: 0,
      widthPx: 0,
      heightPx: 0
    };

    function updateMazeLayout() {
      maze.widthPx = maze.cols * TILE;
      maze.heightPx = maze.rows * TILE;

      // 화면 중앙에 미로가 오도록 오프셋
      maze.offsetX = Math.floor((window.innerWidth - maze.widthPx) / 2);
      maze.offsetY = Math.floor((window.innerHeight - maze.heightPx) / 2);
    }
    updateMazeLayout();
    window.addEventListener("resize", updateMazeLayout);

    function isWallAtPixel(x, y) {
      // x,y가 미로 영역 밖이면 "벽" 취급
      const localX = x - maze.offsetX;
      const localY = y - maze.offsetY;

      const col = Math.floor(localX / TILE);
      const row = Math.floor(localY / TILE);

      if (row < 0 || row >= maze.rows || col < 0 || col >= maze.cols) return true;
      return maze.map[row][col] === 1;
    }

    function getWallRectsNearCircle(cx, cy, r) {
      // 팩맨 주변 타일만 검사 (성능/가독성 절충)
      const localX = cx - maze.offsetX;
      const localY = cy - maze.offsetY;

      const minCol = Math.floor((localX - r) / TILE);
      const maxCol = Math.floor((localX + r) / TILE);
      const minRow = Math.floor((localY - r) / TILE);
      const maxRow = Math.floor((localY + r) / TILE);

      const rects = [];

      for (let row = minRow; row <= maxRow; row++) {
        for (let col = minCol; col <= maxCol; col++) {
          if (row < 0 || row >= maze.rows || col < 0 || col >= maze.cols) continue;
          if (maze.map[row][col] !== 1) continue;

          rects.push({
            x: maze.offsetX + col * TILE,
            y: maze.offsetY + row * TILE,
            w: TILE,
            h: TILE
          });
        }
      }
      return rects;
    }

    function circleIntersectsRect(cx, cy, r, rect) {
      // 원-사각형 충돌 검사 (closest point)
      const closestX = clamp(cx, rect.x, rect.x + rect.w);
      const closestY = clamp(cy, rect.y, rect.y + rect.h);
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx * dx + dy * dy) <= (r * r);
    }

    /**********************
     * 3) Game State
     **********************/
    const game = {
      score: 0,
      pellets: [],
      sparks: [],
      pacman: {
        x: 0,
        y: 0,
        radius: 12,
        vx: 0,
        vy: 0,
        dirRad: 0,
        mouthTime: 0,
        speed: 3.2
      }
    };

    function placePacmanAtStart() {
      // 시작 위치를 "길"인 타일 가운데로
      // (여기서는 고정 좌표로 대충 한 곳 선택)
      const startCol = 1;
      const startRow = 1;

      game.pacman.x = maze.offsetX + startCol * TILE + TILE / 2;
      game.pacman.y = maze.offsetY + startRow * TILE + TILE / 2;
      game.pacman.vx = game.pacman.speed;
      game.pacman.vy = 0;
      game.pacman.dirRad = 0;
    }
    placePacmanAtStart();
    window.addEventListener("resize", placePacmanAtStart); // 리사이즈 시 대충 재배치(간단 버전)

    /**********************
     * 4) Pellet / Spark
     **********************/
    function spawnSparks(x, y, hue) {
      for (let i = 0; i < 16; i++) {
        const a = rand(0, Math.PI * 2);
        const sp = rand(1.2, 4.4);
        game.sparks.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: rand(18, 40),
          hue
        });
      }
    }

    function randomWalkTileCenter() {
      // 벽이 아닌 타일을 골라 그 중심 좌표를 반환
      for (let tries = 0; tries < 200; tries++) {
        const row = Math.floor(rand(0, maze.rows));
        const col = Math.floor(rand(0, maze.cols));
        if (maze.map[row][col] === 0) {
          return {
            x: maze.offsetX + col * TILE + TILE / 2,
            y: maze.offsetY + row * TILE + TILE / 2
          };
        }
      }
      // 최후의 fallback (거의 안 옴)
      return { x: maze.offsetX + TILE * 1.5, y: maze.offsetY + TILE * 1.5 };
    }

    function spawnPellet() {
      const pos = randomWalkTileCenter();
      game.pellets.push({
        x: pos.x + rand(-6, 6),
        y: pos.y + rand(-6, 6),
        radius: rand(4, 7),
        hue: rand(180, 320)
      });
    }

    function initPellets(count = 24) {
      game.pellets.length = 0;
      for (let i = 0; i < count; i++) spawnPellet();
    }
    initPellets();

    /**********************
     * 5) Update (Collision 포함)
     **********************/
    function updatePacman() {
      const p = game.pacman;
      const { dx, dy } = getMoveVector();

      if (dx !== 0 || dy !== 0) {
        p.vx = dx * p.speed;
        p.vy = dy * p.speed;
        p.dirRad = Math.atan2(p.vy, p.vx);
      }

      // 축 분리 이동 + 충돌 처리
      moveWithWallCollision(p, p.vx, 0);
      moveWithWallCollision(p, 0, p.vy);

      p.mouthTime += 0.12;
    }

    function moveWithWallCollision(p, dx, dy) {
      if (dx === 0 && dy === 0) return;

      const nextX = p.x + dx;
      const nextY = p.y + dy;

      // 주변 벽 사각형만 검사
      const walls = getWallRectsNearCircle(nextX, nextY, p.radius);

      // 충돌 없으면 이동 확정
      let collided = false;
      for (const rect of walls) {
        if (circleIntersectsRect(nextX, nextY, p.radius, rect)) {
          collided = true;
          break;
        }
      }
      if (!collided) {
        p.x = nextX;
        p.y = nextY;
        return;
      }

      // 충돌이 있다면: 해당 축 이동을 취소(가독성/간단함 우선)
      // (더 정교하게 하려면 "겹침만큼 밀어내기"로 바꾸면 됩니다)
      // 여기선 벽을 못 통과하는 것만 확실히 보장.
    }

    function updateSparks() {
      for (let i = game.sparks.length - 1; i >= 0; i--) {
        const sp = game.sparks[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vx *= 0.96;
        sp.vy *= 0.96;
        sp.life -= 1;
        if (sp.life <= 0) game.sparks.splice(i, 1);
      }
    }

    function checkPelletCollision() {
      const p = game.pacman;

      for (let i = game.pellets.length - 1; i >= 0; i--) {
        const q = game.pellets[i];
        const dist = Math.hypot(q.x - p.x, q.y - p.y);

        if (dist < p.radius + q.radius * 0.25) {
          game.pellets.splice(i, 1);

          game.score += 10;
          scoreEl.textContent = game.score;

          spawnSparks(q.x, q.y, q.hue);
          spawnPellet(); // 항상 갯수 유지
        }
      }
    }

    function update() {
      updatePacman();
      updateSparks();
      checkPelletCollision();
    }

    /**********************
     * 6) Render
     **********************/
    function drawBackground() {
      const bg = ctx.createRadialGradient(
        window.innerWidth * 0.5, window.innerHeight * 0.45, 50,
        window.innerWidth * 0.5, window.innerHeight * 0.5, Math.max(window.innerWidth, window.innerHeight)
      );
      bg.addColorStop(0, "#0b0b22");
      bg.addColorStop(1, "#05050a");

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      // 잔상(트레일)
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function drawMazeWalls() {
      // 네온 벽(사각형) + 글로우
      ctx.save();

      // 외곽 글로우 먼저
      ctx.shadowBlur = 18;
      ctx.shadowColor = "rgba(120,160,255,0.9)";

      for (let r = 0; r < maze.rows; r++) {
        for (let c = 0; c < maze.cols; c++) {
          if (maze.map[r][c] !== 1) continue;

          const x = maze.offsetX + c * TILE;
          const y = maze.offsetY + r * TILE;

          // 벽 내부는 어두운 파랑
          ctx.fillStyle = "rgba(20,35,70,0.9)";
          ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
        }
      }

      // 라인 강조(더 선명하게)
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(160,200,255,0.55)";
      ctx.lineWidth = 2;

      for (let r = 0; r < maze.rows; r++) {
        for (let c = 0; c < maze.cols; c++) {
          if (maze.map[r][c] !== 1) continue;

          const x = maze.offsetX + c * TILE;
          const y = maze.offsetY + r * TILE;
          ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
        }
      }

      ctx.restore();
    }

    function drawPellets() {
      for (const q of game.pellets) {
        ctx.save();

        ctx.shadowBlur = 18;
        ctx.shadowColor = `hsla(${q.hue},100%,65%,0.9)`;

        const glow = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.radius * 3.2);
        glow.addColorStop(0, `hsla(${q.hue},100%,70%,0.95)`);
        glow.addColorStop(1, "rgba(0,0,0,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.radius * 3.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = `hsla(${q.hue},100%,75%,0.95)`;
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawSparks() {
      ctx.globalCompositeOperation = "lighter";

      for (const sp of game.sparks) {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = `hsla(${sp.hue},100%,70%,0.9)`;

        const alpha = Math.min(1, sp.life / 40);
        ctx.fillStyle = `hsla(${sp.hue},100%,70%,${alpha})`;

        ctx.beginPath();
        ctx.arc(sp.x, sp.y, rand(1.1, 2.6), 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      ctx.globalCompositeOperation = "source-over";
    }

    function drawPacman() {
      const p = game.pacman;
      const bite = 0.22 + 0.18 * Math.sin(p.mouthTime);
      const startAngle = bite * Math.PI;
      const endAngle = (2 - bite) * Math.PI;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.dirRad);

      ctx.shadowBlur = 28;
      ctx.shadowColor = "rgba(255,240,90,0.9)";

      const bodyGrad = ctx.createRadialGradient(-p.radius * 0.25, -p.radius * 0.25, 2, 0, 0, p.radius * 1.35);
      bodyGrad.addColorStop(0, "#fff6a3");
      bodyGrad.addColorStop(0.55, "#ffe24f");
      bodyGrad.addColorStop(1, "#ffb800");

      ctx.fillStyle = bodyGrad;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, p.radius, startAngle, endAngle, false);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.beginPath();
      ctx.arc(-p.radius * 0.25, -p.radius * 0.32, p.radius * 0.38, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function render() {
      drawBackground();
      drawMazeWalls();   // ✅ 미로 벽
      drawPellets();
      drawSparks();
      drawPacman();
    }

    /**********************
     * 7) Main Loop
     **********************/
    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
