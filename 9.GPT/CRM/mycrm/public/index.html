<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyCRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/app.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#/users" id="brand-home">
        <img src="/assets/logo.svg" alt="MyCRM Logo" width="28" height="28" />
        <span class="fw-semibold">MyCRM</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="topNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="nav-menu">
          <!-- 순서: dashboard(kiosk), user, order, orderitem, item, store -->
          <li class="nav-item"><a class="nav-link" href="#/dashboard" data-route="dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#/users" data-route="users">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="#/orders" data-route="orders">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="#/orderitems" data-route="orderitems">OrderItems</a></li>
          <li class="nav-item"><a class="nav-link" href="#/items" data-route="items">Items</a></li>
          <li class="nav-item"><a class="nav-link" href="#/stores" data-route="stores">Stores</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
      <div class="d-flex align-items-center gap-2">
        <h1 class="h4 m-0" id="page-title">-</h1>
        <span class="text-muted small" id="breadcrumb"></span>
      </div>
      <div class="text-muted small" id="meta-line">-</div>
    </div>

    <section class="card shadow-sm">
      <div class="card-body" id="view-root"></div>
    </section>
  </main>

  <footer class="border-top bg-white py-3 sticky-footer">
    <div class="container">
      <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center m-0" id="pagination"></ul>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
