<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 480px; }
    </style>
</head>
<body>
    <div>
        <label for="start">출발지(lat, lng):</label>
        <input type="text" id="start" value="37.5665, 126.9784" placeholder="예: 37.5665, 126.9784" />
        <label for="end">도착지(lat, lng):</label>
        <input type="text" id="end" value="37.4979, 127.0276" placeholder="예: 37.4979, 127.0276" />
        <button onclick="findRoute()">경로찾기</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([37.5665, 126.9780], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', 
            {}).addTo(map);

        function findRoute() {
            let startInput = document.getElementById('start').value;
            let endInput = document.getElementById('end').value;

            let startCoord = startInput.split(',').map((coord) => parseFloat(coord.trim()));
            let endCoord = endInput.split(',').map((coord) => parseFloat(coord.trim()));
            // console.log(startInput, startCoord);

            let route = L.polyline([startCoord, endCoord], { color: 'blue' }).addTo(map);
            map.fitBounds(route.getBounds());

        }
    </script>
</body>
</html>
