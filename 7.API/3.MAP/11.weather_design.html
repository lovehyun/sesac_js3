<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울시 날씨 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 480px; }

        /* 지도 위에 올릴 날씨 라벨 박스 스타일 */
        .weather-label {
            background: rgba(255, 255, 255, 0.8); /* 반투명 흰색 */
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;                  /* 라운드 테두리 */
            padding: 6px 8px;
            font-size: 12px;
            line-height: 1.3;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 4px;
            pointer-events: none; /* 클릭 이벤트를 막아서 지도 조작 방해 안 되게 */
        }

        .weather-label img {
            width: 28px;
            height: 28px;
        }

        .weather-label .gu-name {
            font-weight: bold;
        }

        .weather-label .temp {
            font-weight: bold;
            color: #e67e22;
        }
    </style>
</head>
<body>
    <h1>서울시 날씨 지도</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([37.5665, 126.9780], 11);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', 
            {}).addTo(map);

        // 서울시 구별 중심 좌표 (샘플 데이터)
        const seoulDistricts = [
            { name: "Jongno-gu",  lat: 37.573050, lng: 126.979189 },
            { name: "Jung-gu",    lat: 37.561128, lng: 126.994303 },
            { name: "Yongsan-gu", lat: 37.532598, lng: 126.990257 },
            { name: "Gangnam-gu", lat: 37.517236, lng: 127.047325 },
            { name: "Seocho-gu",  lat: 37.483570, lng: 127.032646 },
            { name: "Songpa-gu",  lat: 37.514575, lng: 127.105981 },
            { name: "Mapo-gu",    lat: 37.563756, lng: 126.908421 },
            { name: "Gangdong-gu",lat: 37.530125, lng: 127.123764 }
        ];

        // 실제키는 나중에 깃헙에 커밋하지 않도록 주의!! - 키를 발급받아도 활성화까지 수분이 소요되는 사이트임
        const apiKey = "PUT_YOUR_API_KEY_HERE";

        seoulDistricts.forEach((gu) => {
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${gu.lat}&lon=${gu.lng}&units=metric&appid=${apiKey}&lang=kr`;

            fetch(url)
                .then(resp => resp.json())
                .then(data => {
                    console.log(gu.name, data);

                    const temp = data.main.temp;                 // 현재 온도
                    const weather = data.weather[0].description; // 날씨 설명
                    const icon = data.weather[0].icon;           // 날씨 아이콘 코드

                    const iconUrl = `https://openweathermap.org/img/wn/${icon}.png`;

                    // 지도 위에 항상 보이는 div 아이콘 생성
                    const html = `
                        <div class="weather-label">
                            <img src="${iconUrl}" alt="${weather}" />
                            <div>
                                <div class="gu-name">${gu.name}</div>
                                <div>${weather}</div>
                                <div class="temp">${temp}도씨</div>
                            </div>
                        </div>
                    `;

                    const iconDiv = L.divIcon({
                        className: "", // 기본 marker 스타일 제거
                        html: html,
                        iconSize: null,       // 내용 크기에 맞게
                        iconAnchor: [0, 0]    // 좌상단 기준(원하면 살짝 조절 가능)
                    });

                    // 마커 핀 없이, divIcon만 지도에 표시
                    L.marker([gu.lat, gu.lng], { icon: iconDiv }).addTo(map);
                })
                .catch(err => {
                    console.error(gu.name, "날씨 API 오류", err);
                });
        });
    </script>
</body>
</html>
