<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>사용자 조회</h2>
    <input type="number" id="userId" placeholder="사용자ID를 입력하세요">
    <button id="loadContent">불러오기</button>
    <div id="result"></div>

    <script>
        document.getElementById('loadContent').addEventListener('click', async () => {
            const userId = document.getElementById('userId').value;
            const requestURL = `https://jsonplaceholder.typicode.com/users/${userId}`

            // 아래 4줄을 가지고 async/await로 변경하시오..
            // 1. 일단 await 달고, 변수에 결과 담기
            // 2. async 로 비동기 함수인데 await가 포함되어 있음을 선언하기
            // 3. try/catch 로 에러 처리하기

            // fetch(requestURL)
            //     .then(response => checkResponseStatus(response))
            //     .then(data => renderResponseToResult(data))
            //     .catch(error => alert('요청한 사용자가 없습니다!'))
            try {
                const response = await fetch(requestURL);
                const data = await checkResponseStatus(response);
                renderResponseToResult(data);
            } catch (err) {
                console.log('오류:', err);
            }
        });

        async function checkResponseStatus(response) {
            // if (!response.ok) {
            //     throw new Error('네트워크 오류')
            // }
            // return response.json();
            try {
                data = await response.json();
            } catch (err) {
                console.log('파싱오류입니다.', err);
            }
            return data;
        }

        function renderResponseToResult(data) {
            console.log(data);
            document.getElementById('result').innerHTML = `
                <p><strong>이름:</strong> ${data.name}</p>
                <p><strong>이메일:</strong> ${data.email}</p>
                <p><strong>전화번호:</strong> ${data.phone}</p>
                <p><strong>웹사이트:</strong> ${data.website}</p>
            `
        }
    </script>
</body>
</html>
